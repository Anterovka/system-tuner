name: Build AppImage

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev libxcb-randr0-dev libxkbcommon-dev libgtk-3-dev

      - name: Build
        run: cargo build --release

      - name: Create AppDir
        run: |
          APP_NAME=system-tuner
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp target/release/$APP_NAME AppDir/usr/bin/

          cat > AppDir/usr/share/applications/$APP_NAME.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=System Tuner
          Comment=Настройка Linux из одного окна
          Exec=$APP_NAME
          Icon=$APP_NAME
          Categories=System;Settings;
          Terminal=false
          EOF

          cp assets/icon.svg AppDir/usr/share/icons/hicolor/256x256/apps/$APP_NAME.svg 2>/dev/null || true

          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin/:${PATH}"
          exec system-tuner "$@"
          APPRUN
          chmod +x AppDir/AppRun

      - name: Build AppImage
        uses: AppImageCommunity/appimage-builder@v1
        with:
          recipe: AppImageBuilder.yml

      - name: Upload AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: '*.AppImage'
